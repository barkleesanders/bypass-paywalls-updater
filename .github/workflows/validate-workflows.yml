name: Validate workflows

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate every workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Live Dependabot metadata (Node 24)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3 (Node 24)
        with:
          github-token: ${{ github.token }}
      - name: Verify metadata output
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          test -n "$UPDATE_TYPE"
          printf '%s\n' "$UPDATE_TYPE"
